
<!DOCTYPE html>
<html>
<head>
  <title>TSJ Map Viewer</title>
  <meta charset="utf-8" />
  <style>
    #map { height: 90vh; width: 100%; }
    button { margin: 5px; padding: 8px; }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-omnivore/leaflet-omnivore.min.js"></script>
</head>
<body>
  <h2>TSJ Map Viewer</h2>
  <div>
    <button onclick="showTSJ()">TSJ</button>
    <button onclick="loadStyledKML('TSJ DPWS C06SUB22.kml', 'black', false)">Watershed</button>
    <button onclick="loadStyledKML('TSJ DP BASIN.kml', 'blue', false)">Basin</button>
  </div>
  <div id="map"></div>

  <script>
    var map = L.map('map').setView([22.8, 86.2], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    var activeLayers = [];

    function clearLayers() {
      activeLayers.forEach(layer => map.removeLayer(layer));
      activeLayers = [];
    }

    function loadStyledKML(url, color, fill = true, label = null) {
      var layer = omnivore.kml(url)
        .on('ready', function() {
          this.eachLayer(function(l) {
            if (l.setStyle) {
              l.setStyle({
                color: color,
                fillColor: fill ? color : 'transparent',
                fillOpacity: fill ? 0.6 : 0,
                weight: 2
              });
            }
            if (label && l.getLatLng) {
              L.marker(l.getLatLng()).bindPopup(label).addTo(map).openPopup();
            }
          });
          map.fitBounds(this.getBounds());
        })
        .addTo(map);

      activeLayers.push(layer);
    }

    function showTSJ() {
      clearLayers();
      loadStyledKML('TSJ.kml', 'red', true);
      loadStyledKML('TSJ DP.kml', 'red', false, 'Drawl Point');
    }
  </script>
</body>
</html>
