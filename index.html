
<!DOCTYPE html>
<html>
<head>
  <title>TSJ KML Viewer</title>
  <meta charset="utf-8" />
  <style>
    #map { height: 90vh; width: 100%; }
    button { margin: 5px; padding: 8px; }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-omnivore/leaflet-omnivore.min.js"></script>
</head>
<body>
  <h2>TSJ Map Viewer</h2>
  <div>
    <button onclick="loadKML('TSJ.kml')">TSJ Site Boundary</button>
    <button onclick="loadKML('TSJ DP.kml')">Drawl Point</button>
    <button onclick="loadKML('TSJ DPWS C06SUB22.kml')">Watershed Boundary</button>
    <button onclick="loadKML('TSJ DP BASIN.kml')">River Basin</button>
  </div>
  <div id="map"></div>

  <script>
    var map = L.map('map').setView([22.8, 86.2], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    var currentLayer = null;

    function loadKML(url) {
      if (currentLayer) {
        map.removeLayer(currentLayer);
      }
      currentLayer = omnivore.kml(url)
        .on('ready', function() {
          map.fitBounds(currentLayer.getBounds());
        })
        .addTo(map);
    }
  </script>
</body>
</html>
